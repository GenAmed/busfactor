# Composite GitHub Action: runs busfactor on the repository and writes the
# markdown card to the job summary. See README.md, "GitHub Action" for the
# optional PR comment.
name: busfactor
description: "Which humans does your project actually depend on? Scans the lockfile and reports dead, dormant and single-publisher dependencies."
author: GenAmed

# Required to list this action on the GitHub Marketplace.
branding:
  icon: users
  color: blue

inputs:
  path:
    description: "Folder containing the lockfile, or the lockfile itself."
    required: false
    default: "."
  fail-on:
    description: "Fail the job when this rule matches: 'dead' or 'solo-critical'. Empty = never fail."
    required: false
    default: ""
  version:
    description: "busfactor version to run from npm (default: latest)."
    required: false
    default: "latest"

outputs:
  markdown-file:
    description: "Path of the generated markdown card."
    value: ${{ steps.run.outputs.markdown-file }}
  json-file:
    description: "Path of the generated JSON report."
    value: ${{ steps.run.outputs.json-file }}

runs:
  using: composite
  steps:
    - name: Run busfactor
      id: run
      shell: bash
      env:
        BF_PATH: ${{ inputs.path }}
        BF_FAIL_ON: ${{ inputs.fail-on }}
        BF_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/busfactor"
        mkdir -p "$out"
        # Full JSON first (this is the only network round), then the card is
        # produced from the cache without touching the network again.
        npx --yes "@genamed/busfactor@${BF_VERSION}" "$BF_PATH" --json --out "$out/report.json"
        npx --yes "@genamed/busfactor@${BF_VERSION}" "$BF_PATH" --md --offline --out "$out/card.md"
        cat "$out/card.md" >> "$GITHUB_STEP_SUMMARY"
        echo "markdown-file=$out/card.md" >> "$GITHUB_OUTPUT"
        echo "json-file=$out/report.json" >> "$GITHUB_OUTPUT"
        if [ -n "$BF_FAIL_ON" ]; then
          npx --yes "@genamed/busfactor@${BF_VERSION}" "$BF_PATH" --offline --fail-on "$BF_FAIL_ON" > /dev/null
        fi
